name: apply-remaining-pins
on:
  push:
    branches: [cursor/preflight-gate-0.16.1-f98f]
    paths: [.github/workflows/apply-remaining-pins.yml]
permissions:
  contents: write
concurrency:
  group: apply-remaining-pins
  cancel-in-progress: false
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'APPLY_REMAINING_PINS')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: cursor/preflight-gate-0.16.1-f98f
      - name: Reconstruct exact local pin bytes
        run: |
          set -euo pipefail
          git checkout a2b194048f6de48ef9d4a485ea3016cade50156a -- test/harness.mjs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          h = Path('test/harness.mjs')
          t = h.read_text().replace('0.13.0', '0.16.1').replace('0.5.0', '0.5.1')
          h.write_text(t)
          assert hashlib.sha256(t.encode()).hexdigest() == 'ced7ce0665a8a28a9a0ec2ccc0d47dead9270fb4666f804bbbcc8cff0cef3d2b', hashlib.sha256(t.encode()).hexdigest()
          rec = Path('package-lock.json').read_text()
          rec = rec.replace('"version": "0.4.3"', '"version": "0.5.1"')
          rec = rec.replace('"twzrd-x402-gate": "0.13.0"', '"twzrd-x402-gate": "0.16.1"')
          rec = rec.replace('"version": "0.13.0"', '"version": "0.16.1"')
          rec = rec.replace('twzrd-x402-gate-0.13.0.tgz', 'twzrd-x402-gate-0.16.1.tgz')
          rec = rec.replace(
              'sha512-j5x5vYQLF5YZfMcEDFbEDgq1B8yyaJJi84XO/hT2Y452xgpYm7vJe06cMbqnXUIsBY/0xPwt86F42fwq0Vp9qQ==',
              'sha512-82gceQ/iHZb6TcXaj93Rq5wzm2UQybXIidR3pH3G17z+HP3LeIg6dVwOe2BeUXdnEHr/VdqOwUXjz0wbtApr9Q==',
          )
          Path('package-lock.json').write_text(rec)
          assert hashlib.sha256(rec.encode()).hexdigest() == 'fea2ef5c3ebbeac8dc8c9e77a53bfe4a9222773f77e3e165abf7cedac54876b5', hashlib.sha256(rec.encode()).hexdigest()
          print('reconstructed hashes match local checkout')
          PY
          rm -f .github/workflows/apply-remaining-pins.yml
          git config user.name TWZRD
          git config user.email 33047129+twzrd-sol@users.noreply.github.com
          git add test/harness.mjs package-lock.json .github/workflows/apply-remaining-pins.yml
          git commit -m 'preflight 0.5.1: remaining pin updates for twzrd-x402-gate 0.16.1'
          git push origin HEAD:cursor/preflight-gate-0.16.1-f98f
